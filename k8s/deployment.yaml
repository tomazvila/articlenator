apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitter-articlenator
  labels:
    app: twitter-articlenator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twitter-articlenator
  template:
    metadata:
      labels:
        app: twitter-articlenator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: twitter-articlenator
          image: twitter-articlenator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              name: http
          env:
            - name: TWITTER_ARTICLENATOR_JSON_LOGGING
              value: "true"
            - name: TWITTER_ARTICLENATOR_OUTPUT_DIR
              value: "/data/output"
            - name: TWITTER_ARTICLENATOR_CONFIG_DIR
              value: "/data/config"
            - name: TWITTER_ARTICLENATOR_REQUIRE_COOKIE_ENCRYPTION
              value: "true"
            - name: TWITTER_ARTICLENATOR_SESSION_COOKIE_SECURE
              value: "true"
            - name: TWITTER_ARTICLENATOR_TRUST_PROXY_HEADERS
              value: "true"
            - name: TWITTER_ARTICLENATOR_TRUSTED_HOSTS
              value: "articlenator.homelab.tomazvi.la"
            - name: TWITTER_ARTICLENATOR_PLAYWRIGHT_PER_USER_LIMIT
              value: "1"
            - name: TWITTER_ARTICLENATOR_PLAYWRIGHT_GLOBAL_LIMIT
              value: "2"
            - name: TWITTER_ARTICLENATOR_TRANSCRIPTION_PER_USER_LIMIT
              value: "1"
            - name: TWITTER_ARTICLENATOR_TRANSCRIPTION_GLOBAL_LIMIT
              value: "1"
            - name: TWITTER_ARTICLENATOR_DOWNLOAD_PER_USER_LIMIT
              value: "1"
            - name: TWITTER_ARTICLENATOR_DOWNLOAD_GLOBAL_LIMIT
              value: "2"
            - name: TWITTER_ARTICLENATOR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: twitter-articlenator-secrets
                  key: flask-secret-key
            - name: TWITTER_ARTICLENATOR_COOKIE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: twitter-articlenator-secrets
                  key: youtube-cookie-encryption-key
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: twitter-articlenator-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: twitter-articlenator
  labels:
    app: twitter-articlenator
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: twitter-articlenator
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: twitter-articlenator-data
  labels:
    app: twitter-articlenator
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twitter-articlenator
  labels:
    app: twitter-articlenator
  annotations:
    # Adjust based on your ingress controller
    # nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  rules:
    - host: articlenator.homelab.tomazvi.la
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: twitter-articlenator
                port:
                  name: http
