# Package metadata only - dependencies managed by Nix (see flake.nix)
[project]
name = "twitter-articlenator"
version = "0.5.7"
description = "Convert X/Twitter articles to e-reader PDFs"
requires-python = ">=3.12"

[project.scripts]
twitter-articlenator = "twitter_articlenator.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twitter_articlenator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "transcription: slow end-to-end whisper.cpp WER suite (opt-in via RUN_TRANSCRIPTION_WER=1)",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
# Ruff 0.16 expanded its default rule set (BLE, S, RUF, I, UP, PLW, ...),
# which retroactively flags existing code. Pin the rule set CI historically
# enforced; lifting the lint debt is a separate, deliberate cleanup.
select = ["E4", "E7", "E9", "F"]
